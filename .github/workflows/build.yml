name: Build & Release

on:
  push:
    branches: ["**", "!ci-screenshots"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the DMG to the existing release with this tag"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and create-dmg
        run: brew install xcodegen create-dmg

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error: " build.log | sed -E 's#^.*/SpotiMusic/##' | sort -u > errors.txt || true
          # Annotations are capped at 10 per type per step, so spread them over three types.
          sed -n '1,10p' errors.txt | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '11,20p' errors.txt | while IFS= read -r l; do echo "::warning::$l"; done
          sed -n '21,30p' errors.txt | while IFS= read -r l; do echo "::notice::$l"; done
          echo "Total errors: $(wc -l < errors.txt)"
          exit 1

      - name: Report more compiler errors
        if: failure()
        run: |
          sed -n '31,40p' errors.txt | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '41,50p' errors.txt | while IFS= read -r l; do echo "::warning::$l"; done
          sed -n '51,60p' errors.txt | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Package DMG
        run: ./scripts/package_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotiMusic-dmg
          path: build/SpotiMusic-*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: build/SpotiMusic-*.dmg
          generate_release_notes: ${{ github.event_name == 'push' }}

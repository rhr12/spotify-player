name: SpotiMusic
options:
  bundleIdPrefix: com.spotimusic
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpotiMusic:
    type: application
    platform: macOS
    sources:
      - path: SpotiMusic
    settings:
      base:
        PRODUCT_NAME: SpotiMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.spotimusic.app
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SpotiMusic/Info.plist
      properties:
        CFBundleDisplayName: SpotiMusic
        CFBundleName: SpotiMusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "SpotiMusic is not affiliated with Spotify or Apple."
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  SpotiMusic:
    build:
      targets:
        SpotiMusic: all
    run:
      config: Debug
    archive:
      config: Release
